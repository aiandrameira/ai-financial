<div class="flex h-screen overflow-hidden bg-background text-primary">
    <aside
        class="relative flex h-full shrink-0 flex-col border-r border-border bg-muted"
        [class.transition-all]="!resizing()"
        [style.width.px]="collapsed() ? 64 : width()"
    >
        <ai-sidenav-profile [user]="user()" [userMenuItems]="userMenuItems()" [collapsed]="collapsed()" (userMenuAction)="onUserMenuAction($event)" />

        <div class="flex-1 overflow-y-auto py-4">
            @for (group of groups(); track group.label) {
                <div class="px-3 pb-4">
                    @if (!collapsed()) {
                        <p class="px-2 pb-2 text-xs font-title font-bold tracking-wider uppercase text-muted-foreground">{{ group.label }}</p>
                    }

                    <nav class="flex flex-col gap-y-1">
                        @for (item of group.items; track item.path) {
                            <a
                                [routerLink]="item.path"
                                routerLinkActive="bg-primary/10 text-primary"
                                [aiPosition]="'right'"
                                [aiTooltip]="collapsed() ? item.label : ''"
                                [class.justify-center]="collapsed()"
                                class="flex items-center gap-2 rounded-md font-text font-semibold px-2 py-1.5 text-sm text-muted-foreground hover:bg-primary/10 hover:text-primary"
                            >
                                <ai-icon [icon]="item.icon" size="sm" />
                                @if (!collapsed()) {
                                    <span>{{ item.label }}</span>
                                }
                            </a>
                        }
                    </nav>
                </div>
            }
        </div>

        <div class="flex flex-col gap-0.5 border-t border-border p-2">
            <div class="flex items-center gap-2 rounded-md font-text font-semibold px-2 py-1.5 text-sm text-muted-foreground hover:bg-primary/10 hover:text-primary"
                [class.justify-center]="collapsed()"
                [aiPosition]="'right'"
                [aiTooltip]="collapsed() ? 'Tema' : ''">
                <ai-icon icon="moon-clear" size="sm" />
                @if (!collapsed()) {
                    <span>Tema</span>
                }
            </div>

            <div class="flex items-center gap-2 rounded-md font-text font-semibold px-2 py-1.5 text-sm text-muted-foreground hover:bg-primary/10 hover:text-primary"
                [class.justify-center]="collapsed()"
                [aiPosition]="'right'"
                [aiTooltip]="collapsed() ? '00:00' : ''">
                <ai-icon icon="timer" size="sm" />
                @if (!collapsed()) {
                    <span class="flex-1">Tempo</span>
                    <span class="text-xs">00:00</span>
                }
            </div>
        </div>

        @if (!collapsed()) {
            <div class="absolute top-0 right-0 h-full w-1 cursor-col-resize hover:bg-primary/30" (mousedown)="onResizeStart($event)"></div>
        }

        <button
            type="button"
            class="absolute top-1/2 right-0 flex h-10 w-5 -translate-y-1/2 translate-x-1/2 items-center justify-center rounded-lg border border-border bg-background text-muted-foreground shadow-sm hover:bg-border hover:text-foreground"
            (click)="toggleCollapsed()"
        >
            <ai-icon [icon]="collapsed() ? 'arrow-right-s' : 'arrow-left-s'" size="sm" />
        </button>
    </aside>

    <div class="flex flex-1 flex-col overflow-hidden">
        <ai-sidenav-header />

        <main class="flex-1 overflow-y-auto">
            <router-outlet />
        </main>

        <ai-sidenav-footer />
    </div>
</div>
