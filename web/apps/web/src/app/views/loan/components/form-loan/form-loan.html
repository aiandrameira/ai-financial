<div class="flex flex-col gap-y-4">
    @if (!isNew()) {
        <ai-alert
            variant="warning"
            title="Atenção"
            description="Valor, taxa, parcelas e data de início não podem ser alterados após a criação, pois o cronograma de amortização já foi gerado." />
    }

    <ai-input class="w-full" 
        label="Nome" 
        [maxlength]="120" 
        [formField]="form.name" />

    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-2 gap-y-4">
        <div class="flex flex-col gap-y-2">
            <ai-select
                class="w-full [&_button]:h-12"
                placeholder="Selecione o tipo"
                [value]="form().value().type"
                [disabled]="form().disabled()"
                (selectionChange)="onTypeChange($event)">
                @for (type of loanTypes; track type) {
                    <ai-select-item [value]="type">
                        <ai-badge-tp-loan [type]="type" />
                    </ai-select-item>
                }
            </ai-select>

            @if (form().value().type; as type) {
                <ai-badge-tp-loan [type]="type" class="w-max" />
            }
        </div>

        <div class="flex flex-col gap-y-2">
            <ai-select
                class="w-full [&_button]:h-12"
                placeholder="Selecione a conta"
                [value]="form().value().accountId"
                [disabled]="form().disabled()"
                (selectionChange)="onAccountChange($event)">
                @for (account of accounts(); track account.id) {
                    <ai-select-item [value]="account.id">
                        <ai-badge-tp-account [account]="account" />
                    </ai-select-item>
                }
            </ai-select>

            @if (selectedAccount(); as account) {
                <ai-badge-tp-account [account]="account" class="w-max" />
            }
        </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-2 gap-y-4">
        <ai-input class="w-full" 
            label="Valor financiado" 
            [maskConfig]="vlMaskConfig" 
            [formField]="form.principalAmount" />
        <ai-input class="w-full" 
            label="Taxa de juros (% a.m.)" 
            [formField]="form.interestRate" />
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-2 gap-y-4">
        <ai-input class="w-full" 
            normalize="numeric" 
            label="Número de parcelas" 
            [formField]="form.installmentsTotal" />

        <ai-date-picker
            class="w-full"
            placeholder="Data de início"
            format="dd/MM/yyyy"
            [value]="form().value().startDate"
            [disabled]="form().disabled() || !isNew()"
            (valueChange)="onDateChange($event)" />
    </div>

    <div class="flex justify-end gap-x-2 border-t border-border pt-2">
        @let isDisabled = form().disabled();

        <ai-button-form
            [isNew]="isNew()"
            [disabled]="isDisabled"
            [loading]="loading()"
            (cancelEdit)="enabled.set(true)"
            (edit)="enabled.set(false)"
            (save)="onSave()" />
    </div>
</div>
