<ai-table [config]="config()" (rowClick)="rowClick($event)">
    <ng-template aiCellTemplate="type" let-item>
        <ai-badge variant="default" fill="line">{{ tpLoanMap.get(item.type) }}</ai-badge>
    </ng-template>

    <ng-template aiCellTemplate="principalAmount" let-item>
        {{ item.principalAmount | currency }}
    </ng-template>

    <ng-template aiCellTemplate="outstandingBalance" let-item>
        {{ item.outstandingBalance | currency }}
    </ng-template>

    <ng-template aiCellTemplate="installmentsTotal" let-item>
        {{ item.installmentsTotal }}x
    </ng-template>

    <ng-template aiCellTemplate="installments" let-item>
        <ai-button variant="default" fill="line" icon="file-list" size="xs" aiTooltip="Ver parcelas" (click)="onInstallments($event, item)" />
    </ng-template>

    <ng-template aiCellTemplate="remove" let-item>
        <ai-button variant="destructive" fill="line" icon="delete-bin" size="xs" (click)="onRemove($event, item)" />
    </ng-template>
</ai-table>
