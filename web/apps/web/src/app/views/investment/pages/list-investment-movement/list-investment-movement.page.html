<div class="main">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <ai-heading
            icon="line-chart"
            title="Movimentações"
            [description]="asset() ? 'Movimentações do ativo ' + asset()!.name + '.' : 'Movimentações do ativo.'"
        />

        <div class="flex flex-wrap gap-2 self-start sm:self-auto">
            <ai-button size="sm" variant="accent" icon="hand-coin" (click)="openPrice()">Atualizar preço</ai-button>
            <ai-button size="sm" icon="add-circle" (click)="openMovement()">Registrar movimentação</ai-button>
            <ai-button size="sm" variant="default" (click)="goBack()">
                <ai-icon icon="arrow-left" />
                Voltar
            </ai-button>
        </div>
    </div>

    @if (asset(); as asset) {
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
            <ai-stat-card title="Quantidade" [value]="asset.quantity" icon="box-3" variant="indigo" />
            <ai-stat-card title="Preço médio" [value]="asset.averagePrice | currency" icon="price-tag-3" variant="emerald" />
            <ai-stat-card title="Valor investido" [value]="asset.investedAmount | currency" icon="money-dollar-circle" variant="sky" />
            <ai-stat-card title="Valor atual" [value]="asset.currentValue | currency" icon="bar-chart-2" variant="violet" />
            <ai-stat-card
                title="Resultado"
                [value]="asset.profitLoss | currency"
                [icon]="asset.profitLoss >= 0 ? 'arrow-right-up' : 'arrow-right-down'"
                [variant]="asset.profitLoss >= 0 ? 'emerald' : 'rose'"
                class="col-span-2 sm:col-span-1">
                @if (asset.profitLossPercent !== undefined && asset.profitLossPercent !== null) {
                    <span
                        [class]="
                            'text-xs font-semibold whitespace-nowrap ' +
                            (asset.profitLoss >= 0
                                ? 'text-emerald-600 dark:text-emerald-400'
                                : 'text-rose-600 dark:text-rose-400')
                        ">
                        ({{ asset.profitLossPercent >= 0 ? '+' : '' }}{{ asset.profitLossPercent }}%)
                    </span>
                }
            </ai-stat-card>
        </div>
    }

    <ai-table-investment-movement [investmentId]="id()" />
</div>
