<div class="flex flex-col gap-y-4">
    <ai-input class="w-full" label="Preço atual" [maskConfig]="vlMaskConfig" [formField]="form.price" />

    <ai-date-picker
        class="w-full"
        placeholder="Data de referência"
        format="dd/MM/yyyy"
        [value]="form().value().referenceDate"
        (valueChange)="onDateChange($event)" />

    <div class="flex justify-end gap-x-2 border-t border-border pt-2">
        <ai-button-form [isNew]="true" [loading]="loading()" (save)="onSave()" />
    </div>
</div>
