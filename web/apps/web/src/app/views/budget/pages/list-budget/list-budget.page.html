<div class="main">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <ai-heading icon="pie-chart" title="Orçamento" description="Planeje e acompanhe seus gastos por categoria." />
        <ai-button size="sm" icon="add-circle" class="self-start sm:self-auto" (click)="openCreate()">
            Cadastrar orçamento
        </ai-button>
    </div>

    <div class="flex items-center justify-between rounded-xl border border-border p-3">
        <ai-button variant="outline" fill="line" size="sm" [disabled]="isCurrentMonth()" (click)="goToToday()">Hoje</ai-button>

        <div class="flex items-center gap-x-3">
            <ai-button variant="outline" fill="line" icon="arrow-left-s" size="sm" (click)="previousMonth()" />
            <span class="font-title text-lg font-bold capitalize">{{ monthLabel() }}</span>
            <ai-button variant="outline" fill="line" icon="arrow-right-s" size="sm" (click)="nextMonth()" />
        </div>
    </div>

    @if (budgets().length > 0) {
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
            @for (budget of budgets(); track budget.id) {
                <ai-card-budget [budget]="budget" [category]="category(budget.categoryId)" (edit)="openEdit($event)" (remove)="onRemove($event)" />
            }
        </div>
    } @else if (!loading()) {
        <div class="flex flex-col items-center justify-center gap-y-2 rounded-xl border border-dashed border-border py-12 text-center text-muted-foreground">
            <ai-icon icon="pie-chart" size="lg" class="opacity-50" />
            <p>Nenhum orçamento cadastrado para {{ monthLabel() }}.</p>
        </div>
    }
</div>
