<div class="flex min-h-screen items-center justify-center bg-muted p-4">
    <div class="grid w-full max-w-xl lg:max-w-4xl grid-cols-1 overflow-hidden rounded-3xl bg-background shadow-2xl lg:grid-cols-2">
        <div class="flex flex-col justify-center gap-y-6 p-8 sm:p-12">
            <div class="flex flex-col gap-y-1">
                <h1 class="font-title text-3xl font-bold tracking-tight text-primary">AI Financial</h1>
                <p class="text-sm font-semibold text-muted-foreground">Entre com sua conta pra acessar suas finanças.</p>
            </div>

            <div class="flex flex-col gap-y-4">
                <ai-input class="w-full" type="email" label="Email" [formField]="form.email" />
                <ai-input class="w-full" type="password" label="Senha" [formField]="form.password" />

                <ai-button full [loading]="loading()" [disabled]="form().invalid()" (click)="onSubmit()">
                    {{ loading() ? "Entrando" : "Entrar" }}
                </ai-button>
            </div>

            <div class="flex items-center gap-x-2">
                <span class="h-px w-full bg-border"></span>
                <span class="shrink-0 text-xs font-semibold text-muted-foreground">ou continue com</span>
                <span class="h-px w-full bg-border"></span>
            </div>

            <ai-button full variant="outline" icon="google" (click)="onSignInGoogle()">Entrar com Google</ai-button>
        </div>

        <div class="relative hidden overflow-hidden bg-linear-to-br from-primary to-accent p-10 lg:flex lg:flex-col lg:items-center lg:justify-center">
            <span class="absolute -top-10 -left-10 h-40 w-40 rounded-full bg-white/10"></span>
            <span class="absolute -bottom-16 -right-10 h-56 w-56 rounded-full bg-white/10"></span>
            <span class="absolute top-1/3 right-6 h-16 w-16 rounded-full bg-white/10"></span>

            <div class="relative z-10 flex flex-col items-center gap-y-4 text-center text-white">
                <span class="flex h-16 w-16 items-center justify-center rounded-2xl bg-white/15 backdrop-blur-sm">
                    <ai-icon icon="wallet" size="xl" />
                </span>
                <h2 class="font-title text-xl font-bold">Controle suas finanças</h2>
                <p class="max-w-64 text-sm font-semibold text-white/80">
                    Contas, transações, orçamento, investimentos e planejamento — tudo num só lugar.
                </p>
            </div>
        </div>
    </div>
</div>
