<ai-table [pagination]="paginationConfig()" (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)" [config]="config()">
    <ng-template aiCellTemplate="date" let-item>
        <ai-badge variant="default">{{ dateLabel(item.date) }}</ai-badge>
    </ng-template>

    <ng-template aiCellTemplate="amount" let-item>
        {{ item.amount | currency }}
    </ng-template>

    <ng-template aiCellTemplate="remove" let-item>
        <ai-button variant="destructive" fill="line" icon="delete-bin" size="xs" (click)="onRemove(item)" />
    </ng-template>
</ai-table>
