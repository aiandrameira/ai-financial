<div class="main">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <ai-heading
            icon="triangular-flag"
            title="Aportes"
            [description]="goal() ? 'Aportes da meta ' + goal()!.name + '.' : 'Aportes da meta.'"
         />

        <div class="flex flex-wrap gap-2 self-start sm:self-auto">
            <ai-button size="sm" icon="add-circle" (click)="openContribution()">Registrar aporte</ai-button>
            <ai-button size="sm" variant="default" (click)="goBack()">
                <ai-icon icon="arrow-left" />
                Voltar
            </ai-button>
        </div>
    </div>

    @if (goal(); as goal) {
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <ai-stat-card title="Valor atual" [value]="goal.currentAmount | currency" icon="money-dollar-circle" variant="emerald" />
            <ai-stat-card title="Falta" [value]="goal.remainingAmount | currency" icon="time" variant="amber" />
            <ai-stat-card title="Progresso" [value]="goal.progressPercent + '%'" icon="pie-chart" variant="sky" />
        </div>
    }

    <ai-table-goal-contribution [goalId]="id()" />
</div>
