server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # nginx's default mime.types has no entry for .mjs, so it falls back to
    # application/octet-stream — browsers refuse to execute ES modules served
    # with that type, which breaks mermaid's dynamic diagram-renderer imports.
    location ~* \.mjs$ {
        default_type application/javascript;
    }
}
