name: ai-financial

services:
  postgres:
    image: postgres:17
    container_name: ai_financial_db
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: ai_financial
    ports:
      - "65433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d ai_financial"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        NPM_AUTH_TOKEN: ${NPM_AUTH_TOKEN}
    container_name: ai_financial_api
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql://docker:docker@postgres:5432/ai_financial?schema=public
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: apps/web/Dockerfile
      args:
        NPM_AUTH_TOKEN: ${NPM_AUTH_TOKEN}
    container_name: ai_financial_web
    ports:
      - "4213:80"
    depends_on:
      - api

  docs:
    build:
      context: ./api
      dockerfile: Dockerfile.docs
      args:
        NPM_AUTH_TOKEN: ${NPM_AUTH_TOKEN}
    container_name: ai_financial_docs
    ports:
      - "4003:80"
